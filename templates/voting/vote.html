{% extends 'base.html' %}

{% block title %}Cast Your Vote{% endblock %}

{% block content %}

    <h1>{{ poll.question }}</h1>

    {% if poll.description %}
        <p class="description">{{ poll.description }}</p>
    {% endif %}

    <form method="POST" class="card">
        {% csrf_token %}

        <h2>Cast Your Vote</h2>

        {{ form.as_p }}

        <button type="submit">Submit Vote</button>
    </form>

    <a class="back-link" href="{% url 'polls:poll_detail' poll.slug %}">
        &larr; Back to Poll
    </a>

{% endblock %}
