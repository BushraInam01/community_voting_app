<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>
</head>
<body>

    <h1>Login to Your Account</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <input
            type="hidden"
            name="next"
            value="{{ next }}"
        >

        <button type="submit">Login</button>

    </form>

    <p>
        Don't have an account?
        <a href="{% url 'accounts:register' %}">
            Register here
        </a>
    </p>

</body>
</html>
