{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

    <h1>Login to Your Account</h1>

    <form method="POST" class="card">

        {% csrf_token %}

        {{ form.as_p }}

        <input
            type="hidden"
            name="next"
            value="{{ next }}"
        >

        <button type="submit">Login</button>

    </form>

    <p>
        Don't have an account?
        <a href="{% url 'accounts:register' %}">Register here</a>
    </p>

{% endblock %}
