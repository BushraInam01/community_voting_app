{% extends 'base.html' %}

{% block title %}Create Account{% endblock %}

{% block content %}

    <h1>Create Your Account</h1>

    <form method="POST" class="card">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register</button>

    </form>

    <p>
        Already have an account?
        <a href="{% url 'accounts:login' %}">Login here</a>
    </p>

{% endblock %}
