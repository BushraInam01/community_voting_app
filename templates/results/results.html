{% extends 'base.html' %}
{% load static %}

{% block title %}Results: {{ poll.question }}{% endblock %}

{% block extra_head %}
    <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false}'>

    <script src="{% static 'js/htmx.min.js' %}"></script>
{% endblock %}

{% block content %}

    <h1>{{ poll.question }}</h1>

    <div
        id="live-results"
        class="card"
        hx-get="{% url 'results:poll_results' poll.slug %}"
        hx-trigger="{% if is_live %}every 3s{% else %}none{% endif %}"
        hx-swap="innerHTML"
    >
        {% include 'results/partials/live_results.html' %}
    </div>

    <p>
        <a href="{% url 'polls:poll_detail' poll.slug %}">&larr; Back to Poll</a>
        &nbsp;|&nbsp;
        <a href="{% url 'results:results_list' %}">&larr; All Results</a>
    </p>

{% endblock %}
