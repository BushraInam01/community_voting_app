
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Results</title>

    <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>

    <h1>{{ poll.question }}</h1>

    <div
        id="live-results"
        hx-get="{% url 'results:poll_results' poll.slug %}"
        hx-trigger="{% if is_live %}every 3s{% else %}none{% endif %}"
        hx-swap="innerHTML"
    >
        {% include 'results/partials/live_results.html' %}
    </div>

    <div>
        <a href="{% url 'polls:poll_detail' poll.slug %}">
            ← Back to Poll
        </a>
        |
        <a href="{% url 'results:results_list' %}">
            ← All Results
        </a>
    </div>

</body>
</html>
