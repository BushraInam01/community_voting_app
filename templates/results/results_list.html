<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Poll Results</title>
</head>
<body>

    <h1>All Poll Results</h1>

    {% for poll in polls %}

        <div>
            <h2>{{ poll.question }}</h2>

            <p>
                Voting Type: {{ poll.get_voting_type_display }}
            </p>

            <a href="{% url 'results:poll_results' poll.slug %}">
                View Results
            </a>
        </div>

        <hr>

    {% empty %}

        <p>No polls available.</p>

    {% endfor %}

</body>
</html>
