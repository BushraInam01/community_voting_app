{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Iframe Test</title>
</head>
<body>

    <h1>Community Poll Widget Test</h1>

    {% if poll %}
        <iframe
            src="{% url 'polls:poll_embed' poll.slug %}"
            width="600"
            height="220"
            title="Community Poll Widget"
            loading="lazy">
        </iframe>
    {% else %}
        <p>Create a poll first, then reload this page.</p>
    {% endif %}

    <script src="{% static 'js/embed-parent.js' %}"></script>

</body>
</html>
